# nginx PRODUKSI untuk mLITE (di belakang Caddy).
# Turunan dari default.conf ditambah blokir file sensitif. Seluruh repo di-mount sebagai web root,
# jadi tanpa aturan ini docker/.env (password DB), .env, *.sql, dan .git bisa diunduh.

# Caddy meneruskan permintaan sebagai http ke nginx; beri tahu PHP bahwa aslinya https
# supaya url() mLITE membuat link https (tanpa mixed content).
map $http_x_forwarded_proto $rm_https {
    https   on;
    default "";
}

server {
    listen 0.0.0.0:80;

    root /var/www/html;
    client_max_body_size 100M;
    server_tokens off;

    # IP asli pengunjung dari Caddy (jaringan internal docker)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    # ---- blokir file & folder sensitif ----
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(sql|sdb|sqlite|log|bak|sh|yaml|yml|md|lock|dist|example)$ { deny all; return 404; }
    location ^~ /docker/      { deny all; return 404; }
    location ^~ /backups/     { deny all; return 404; }
    location ^~ /backup/      { deny all; return 404; }
    location ^~ /systems/     { deny all; return 404; }
    location ^~ /vendor/      { deny all; return 404; }
    location ^~ /tmp/         { deny all; return 404; }
    location ^~ /admin/tmp/   { deny all; return 404; }
    location ~ ^/(composer\.json|config\.php|install\.php|tools\.php|workerman\.php)$ { deny all; return 404; }
    location ~* ^/uploads/.*\.(php|phtml|phar)$ { deny all; return 404; }

    location / {
        index index.php;
        if (!-e $request_filename) {
            rewrite / /index.php last;
        }
    }

    location /admin {
        index index.php;
        try_files $uri $uri/ /admin/index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
        fastcgi_param HTTPS $rm_https;
        fastcgi_read_timeout 120s;
    }

    location ~* \.(css|js|woff2?|ttf|png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
